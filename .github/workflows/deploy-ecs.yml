name: Deploy ECS service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing image tag to deploy from the astro-blog ECR repository
        required: true
        type: string
        default: v1.0.1
      supabase_url:
        description: HTTPS URL of the Supabase project used by the leaderboard API
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ecs-service-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Install CDK dependencies
        run: npm ci
        working-directory: cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy ECS service
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          SUPABASE_URL: ${{ inputs.supabase_url }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid ECR image tag: $IMAGE_TAG" >&2
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "Invalid Supabase project URL." >&2
            exit 1
          fi
          npx cdk deploy EcsStack \
            --parameters "EcsStack:ImageTag=$IMAGE_TAG" \
            --parameters "EcsStack:SupabaseUrl=$SUPABASE_URL" \
            --require-approval never
        working-directory: cdk
